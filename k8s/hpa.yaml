# HPA da API. Requer metrics-server instalado no cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loja-api
  namespace: n3-gabriel-luiz
  labels:
    app: loja-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loja-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
